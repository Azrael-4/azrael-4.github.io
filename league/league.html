// Criar Tabela Tank
const tbody = document.querySelector("#tabelaItensTank tbody");

function renderTabelaTank() {

    tbody.innerHTML = "";

    idatabase.forEach(item => {

        const linha = document.createElement("tr");

        linha.innerHTML = `
            <td><img src="${item.imagem}"></td>
            <td>${item.nome}</td>
            <td class="cgold">${item.gold}</td>
            <td class="cvida">${item.vida}</td>
            <td class="carmor">${item.armor}</td>
            <td class="cresist">${item.resist}</td>
            <td class="chaste">${item.haste}</td>
            <td class="cregen">${item.regen}</td>
            <td class="cdesc">${item.desc}</td>
        `;
        tbody.appendChild(linha);
    });
}


// Funções Start
renderTabelaTank();



// Organizar
let ultimaColuna = "";
let ordemDecrescente = true;

function ordenarPor(atributo) {

    // Se clicou na mesma coluna, inverte a ordem
    if (ultimaColuna === atributo) {
        ordemDecrescente = !ordemDecrescente;
    } else {
        ultimaColuna = atributo;
        ordemDecrescente = true;
    }

    idatabase.sort((a, b) => {

        // Tratamento para texto
        if (typeof a[atributo] === "string") {

            return ordemDecrescente
                ? b[atributo].localeCompare(a[atributo])
                : a[atributo].localeCompare(b[atributo]);

        }

        // Tratamento para números
        return ordemDecrescente
            ? b[atributo] - a[atributo]
            : a[atributo] - b[atributo];

    });

    renderTabelaTank();

}
