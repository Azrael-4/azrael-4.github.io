<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiny Epic Dungeons Online</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      gap: 20px;
      padding: 20px;
      background-color: #1a1a1a;
      color: #fff;
      align-items: flex-start;
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* Barra lateral fixa e visível */
    #sidebar {
      width: 155px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      position: sticky;
      top: 20px;
      flex-shrink: 0; /* Impede que a sidebar seja comprimida ou suma */
    }

    .deck-container {
      padding: 10px;
      background-color: #333;
      border-radius: 8px;
      text-align: center;
      transition: background-color 0.2s;
    }

    .deck-container.drag-over {
      background-color: #555;
    }
    
    .deck-count {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    #boards-container {
      display: flex;
      gap: 20px;
    }

    /* Grid original 7x7 */
    #dungeon-area {
      display: grid;
      grid-template-columns: repeat(7, 150px);
      grid-template-rows: repeat(7, 150px);
      gap: 5px;
      padding: 20px;
      background-color: #222;
      border-radius: 8px;
      border: 2px solid #444;
    }

    /* Nova grid Misc agora é 7x7 */
    #misc-area {
      display: grid;
      grid-template-columns: repeat(7, 150px);
      grid-template-rows: repeat(7, 150px); 
      gap: 5px;
      padding: 20px;
      background-color: #1c2a38; 
      border-radius: 8px;
      border: 2px solid #2a4055;
    }

    .slot {
      width: 150px;
      height: 150px;
      background-color: #2a2a2a;
      border: 1px dashed #555;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .slot.drag-over {
      background-color: #444;
      border-color: #888;
    }

    .card {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.5);
      transition: transform 0.3s ease; 
      cursor: grab;
    }
    .card:active {
      cursor: grabbing;
    }

    .deck-image {
      width: 120px;
      height: 120px;
      margin: 0 auto;
      display: block;
      border-radius: 8px;
      object-fit: cover;
    }

    .draggable-deck {
      cursor: grab;
    }
    .draggable-deck:active {
      cursor: grabbing;
    }

    /* Estilos dos Marcadores */
    .marker {
      width: 28px;
      height: 28px;
      background-color: rgba(0,0,0,0.8);
      border: 1px solid #666;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: grab;
      z-index: 10;
      user-select: none;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }
    .marker:active {
      cursor: grabbing;
    }

    .slot .marker { position: absolute; margin: 0; }
    .slot .marker:nth-of-type(1) { top: 5px; left: 5px; }
    .slot .marker:nth-of-type(2) { top: 5px; right: 5px; }
    .slot .marker:nth-of-type(3) { bottom: 5px; left: 5px; }
    .slot .marker:nth-of-type(4) { bottom: 5px; right: 5px; }
    .slot .marker:nth-of-type(5) { top: 50%; left: 5px; transform: translateY(-50%); }
    .slot .marker:nth-of-type(6) { top: 50%; right: 5px; transform: translateY(-50%); }
    .slot .marker:nth-of-type(n+7) { top: 50%; left: 50%; transform: translate(-50%, -50%); }
  </style>
</head>

  ethairna: {name:"Ethairna", src:"arquivos/heroes/Ethairna.png", text:"Seeking Bolt: Perform an Intellect check of 5. If successful, spend 2 focus and deal 1 damage to a target within 4 spaces along any path."},

  uliessa: {name:"Uliessa", src:"arquivos/heroes/Uliessa.png", text:"Heal: Whenever you Cast a Spell, you may also spend 2 focus to heal 1 Hero up to 3 rooms away 4 health (can be self)."},

}

const cardbacks = {
  roomback: {name:"Dungeon Deck", src:"arquivos/rooms/Room Back.png", text:"Arraste para revelar."},
  goblinback: {name:"Goblins", src:"arquivos/goblins/Goblin Back.png", text:"Arraste para revelar."},
  minionback: {name:"Minions", src:"arquivos/minions/Minion Back.png", text:"Arraste para revelar."},
  lootback: {name:"Loot", src:"arquivos/loot/Loot Back.png", text:"Arraste para revelar."},
  spellback: {name:"Spells", src:"arquivos/spells/Spell Back.png", text:"Arraste para revelar."},
}

// 1. Função de Embaralhar
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

// 2. Setup do Dungeon Deck (Rooms)
let numPlayers = 0;
while (![2, 3, 4].includes(numPlayers)) {
  const input = prompt("Quantos jogadores? (Digite 2, 3 ou 4)");
  numPlayers = parseInt(input);
}

let availableRooms = Object.keys(rooms).filter(k => rooms[k].type === "Room");
shuffle(availableRooms);
const countA = numPlayers === 2 ? 9 : (numPlayers === 3 ? 7 : 5);
const deckA = availableRooms.splice(0, countA);
const countBRooms = numPlayers * 3;
const deckBRooms = availableRooms.splice(0, countBRooms);
const deckBEncounters = Array(numPlayers).fill("minionencounters");
const deckB = [...deckBRooms, ...deckBEncounters];
shuffle(deckB);
const deckCRooms = availableRooms.splice(0, 3);
const deckC = [...deckCRooms, "bosslairdoor"];
shuffle(deckC);

const decks = {
  rooms: [...deckC, ...deckB, ...deckA],
  goblins: Object.keys(goblins),
  minions: Object.keys(minions),
  loot: Object.keys(loot),
  spells: Object.keys(spells)
};

shuffle(decks.goblins);
shuffle(decks.minions);
shuffle(decks.loot);
shuffle(decks.spells);

const allCardsDB = { ...rooms, ...goblins, ...minions, ...loot, ...spells };

// 3. Setup Visual dos Baralhos na Sidebar
const deckConfigs = [
  { id: 'rooms', back: cardbacks.roomback, action: 'draw_room' },
  { id: 'goblins', back: cardbacks.goblinback, action: 'draw_misc' },
  { id: 'minions', back: cardbacks.minionback, action: 'draw_misc' },
  { id: 'loot', back: cardbacks.lootback, action: 'draw_misc' },
  { id: 'spells', back: cardbacks.spellback, action: 'draw_misc' }
];

function atualizarVisualBaralhos() {
  deckConfigs.forEach(cfg => {
    const imgEl = document.getElementById(`deck-${cfg.id}`);
    const countEl = document.getElementById(`count-${cfg.id}`);
    const currentDeck = decks[cfg.id];
    
    countEl.innerText = `${currentDeck.length} cartas`;
    imgEl.src = cfg.back.src;
    imgEl.title = cfg.back.name;
    
    if (currentDeck.length === 0) {
      imgEl.style.opacity = '0.3';
      imgEl.draggable = false;
      imgEl.classList.remove('draggable-deck');
    } else {
      imgEl.style.opacity = '1';
      imgEl.draggable = true;
      imgEl.classList.add('draggable-deck');
    }

    if (!imgEl.dataset.initialized) {
      imgEl.addEventListener('dragstart', (e) => {
        if (decks[cfg.id].length === 0) return e.preventDefault();
        e.dataTransfer.setData('action', cfg.action);
        e.dataTransfer.setData('deckType', cfg.id);
      });
      imgEl.dataset.initialized = "true";
    }

    const container = document.getElementById(`container-${cfg.id}`);
    
    container.addEventListener('dragover', (e) => {
      e.preventDefault();
      container.classList.add('drag-over');
    });

    container.addEventListener('dragleave', () => {
      container.classList.remove('drag-over');
    });

    container.addEventListener('drop', (e) => {
      e.preventDefault();
      container.classList.remove('drag-over');
      
      const action = e.dataTransfer.getData('action');
      const cardId = e.dataTransfer.getData('card_id');
      const originDeck = e.dataTransfer.getData('origin_deck');

      if (action === 'move_card' && originDeck === cfg.id) {
        const cardElement = document.getElementById(cardId);
        if (cardElement) {
          const cardKey = cardElement.dataset.cardKey;
          decks[cfg.id].push(cardKey);
          cardElement.remove();
          atualizarVisualBaralhos();
        }
      }
    });
  });
}
atualizarVisualBaralhos();

// --- Setup e Lógica dos Marcadores ---
const tokensList = ['🚫','🚫','🚫','🚫','🚫','🚫','1️⃣','2️⃣','3️⃣','4️⃣','5️⃣','6️⃣','7️⃣','👹','🗿','😎','😼','👺'];
const markersContainer = document.getElementById('markers-container');

tokensList.forEach((emoji, index) => {
  const marker = document.createElement('div');
  marker.classList.add('marker');
  marker.innerText = emoji;
  marker.draggable = true;
  marker.id = 'marker_' + index;
  
  marker.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('action', 'move_marker');
    e.dataTransfer.setData('marker_id', marker.id);
  });
  
  markersContainer.appendChild(marker);
});

const markersBox = document.getElementById('markers-box');
markersBox.addEventListener('dragover', (e) => {
  e.preventDefault();
  markersBox.classList.add('drag-over');
});
markersBox.addEventListener('dragleave', () => {
  markersBox.classList.remove('drag-over');
});
markersBox.addEventListener('drop', (e) => {
  e.preventDefault();
  markersBox.classList.remove('drag-over');
  
  if (e.dataTransfer.getData('action') === 'move_marker') {
    const markerId = e.dataTransfer.getData('marker_id');
    const marker = document.getElementById(markerId);
    if (marker) {
      markersContainer.appendChild(marker);
    }
  }
});

// 5. Criação da Imagem da Carta
function criarImagemCarta(chaveCarta, originDeckId) {
  const dadosCarta = allCardsDB[chaveCarta];
  const img = document.createElement('img');
  img.src = dadosCarta.src;
  img.alt = dadosCarta.name;
  img.title = `${dadosCarta.name}\n\n${dadosCarta.text}`;
  img.classList.add('card');
  
  img.draggable = true;
  img.id = 'card_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
  img.dataset.rotation = 0;
  img.dataset.originDeck = originDeckId; 
  img.dataset.cardKey = chaveCarta;

  img.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('action', 'move_card');
    e.dataTransfer.setData('card_id', img.id);
    e.dataTransfer.setData('origin_deck', img.dataset.originDeck);
  });

  img.addEventListener('contextmenu', (evt) => {
    evt.preventDefault();
    let rotacaoAtual = parseInt(img.dataset.rotation);
    rotacaoAtual += 90;
    img.dataset.rotation = rotacaoAtual;
    img.style.transform = `rotate(${rotacaoAtual}deg)`;
  });

  return img;
}

// 6. Histórico Global para Ctrl+Z
let historicoJogadas = [];

// 7. Gerador Genérico de Grids
function criarGrid(containerId, totalSlots, slotAcceptsActions, temEntrance = false) {
  const container = document.getElementById(containerId);
  const centroIndex = Math.floor(totalSlots / 2);

  for (let i = 0; i < totalSlots; i++) {
    const slot = document.createElement('div');
    slot.classList.add('slot');
    slot.dataset.index = i;

    if (temEntrance && i === centroIndex) {
      const entranceImg = criarImagemCarta('entrance', 'rooms');
      slot.appendChild(entranceImg);
    }

    slot.addEventListener('dragover', (e) => {
      e.preventDefault();
      slot.classList.add('drag-over');
    });

    slot.addEventListener('dragleave', () => {
      slot.classList.remove('drag-over');
    });

    slot.addEventListener('drop', (e) => {
      e.preventDefault();
      slot.classList.remove('drag-over');
      
      const action = e.dataTransfer.getData('action');
      const deckType = e.dataTransfer.getData('deckType');
      const cardId = e.dataTransfer.getData('card_id');
      const markerId = e.dataTransfer.getData('marker_id');

      const hasCard = slot.querySelector('.card') !== null;

      if (action === 'move_marker') {
        const markerElement = document.getElementById(markerId);
        if (markerElement) {
          slot.appendChild(markerElement);
        }
      } 
      else if (!hasCard) {
        if (slotAcceptsActions.includes(action) && (action === 'draw_room' || action === 'draw_misc')) {
          if (decks[deckType] && decks[deckType].length > 0) {
            const drawnKey = decks[deckType].pop();
            const newImage = criarImagemCarta(drawnKey, deckType);
            
            slot.prepend(newImage);

            historicoJogadas.push({
              deckOrigem: deckType,
              chaveCarta: drawnKey,
              elementoImg: newImage
            });

            atualizarVisualBaralhos();
          }
        } 
        else if (slotAcceptsActions.includes(action) && action === 'move_card') {
          const cardElement = document.getElementById(cardId);
          if (cardElement) {
            slot.prepend(cardElement);
          }
        }
      }
    });

    container.appendChild(slot);
  }
}

criarGrid('dungeon-area', 49, ['draw_room', 'move_card'], true); 
criarGrid('misc-area', 49, ['draw_misc', 'move_card'], false); 

// 8. Funcionalidade Ctrl + Z
window.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    if (historicoJogadas.length > 0) {
      const ultimaJogada = historicoJogadas.pop();
      ultimaJogada.elementoImg.remove();
      decks[ultimaJogada.deckOrigem].push(ultimaJogada.chaveCarta);
      atualizarVisualBaralhos();
    }
  }
});
