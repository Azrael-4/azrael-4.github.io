<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tiny Epic Dungeons Online</title>
  <script src="https://unpkg.com/drag-drop-touch"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      gap: 20px;
      padding: 20px;
      background-color: #1a1a1a;
      color: #fff;
      align-items: flex-start;
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* Barra lateral fixa e visível */
    #sidebar {
      width: 155px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      position: sticky;
      top: 20px;
      flex-shrink: 0;
    }

    .deck-container {
      padding: 10px;
      background-color: #333;
      border-radius: 8px;
      text-align: center;
      transition: background-color 0.2s;
    }

    .deck-container.drag-over {
      background-color: #555;
    }
    
    .deck-count {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    #boards-container {
      display: flex;
      gap: 20px;
    }

    /* Envolve a Dungeon e a Tocha na mesma coluna */
    #dungeon-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Grid original 7x7 */
    #dungeon-area {
      display: grid;
      grid-template-columns: repeat(7, 150px);
      grid-template-rows: repeat(7, 150px);
      gap: 5px;
      padding: 20px;
      background-color: #222;
      border-radius: 8px;
      border: 2px solid #444;
    }

    /* Nova grid Misc 7x10 */
    #misc-area {
      display: grid;
      grid-template-columns: repeat(7, 150px);
      grid-template-rows: repeat(10, 150px);
      gap: 5px;
      padding: 20px;
      background-color: #1c2a38; 
      border-radius: 8px;
      border: 2px solid #2a4055;
    }

    .slot {
      width: 150px;
      height: 150px;
      background-color: #2a2a2a;
      border: 1px dashed #555;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .slot.drag-over {
      background-color: #444;
      border-color: #888;
    }

    /* Prevenção de menus nativos e zoom indesejado no mobile */
    .card, .deck-image, .marker, .modal-marker, #torch-mat {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    .card {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.5);
      transition: transform 0.3s ease; 
      cursor: grab;
    }
    .card:active {
      cursor: grabbing;
    }

    .deck-image {
      width: 120px;
      height: 120px;
      margin: 0 auto;
      display: block;
      border-radius: 8px;
      object-fit: cover;
    }

    .draggable-deck {
      cursor: grab;
    }
    .draggable-deck:active {
      cursor: grabbing;
    }

    /* Estilos dos Marcadores Globais */
    .marker {
      width: 40px;
      height: 40px;
      background-color: rgba(0,0,0,0.75);
      border: 1px solid #666;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: grab;
      z-index: 10;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    }
    .marker:active {
      cursor: grabbing;
    }

    .slot .marker { position: absolute; margin: 0; }
    .slot .marker:nth-of-type(1) { top: 5px; left: 5px; }
    .slot .marker:nth-of-type(2) { top: 5px; right: 5px; }
    .slot .marker:nth-of-type(3) { bottom: 5px; left: 5px; }
    .slot .marker:nth-of-type(4) { bottom: 5px; right: 5px; }
    .slot .marker:nth-of-type(5) { top: 50%; left: 5px; transform: translateY(-50%); }
    .slot .marker:nth-of-type(6) { top: 50%; right: 5px; transform: translateY(-50%); }
    .slot .marker:nth-of-type(n+7) { top: 50%; left: 50%; transform: translate(-50%, -50%); }

    /* Estilos do Modal de Herói / Boss (Card) */
    #card-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
    }
    #card-modal-content {
      position: relative;
      display: inline-block; 
      max-width: 90vw;
      max-height: 90vh;
    }
    #card-modal-img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 12px;
      box-shadow: 0px 0px 20px rgba(0,0,0,0.8);
      display: block; 
    }
    #close-card-modal {
      position: absolute;
      top: -15px;
      right: -25px;
      color: #fff;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      text-shadow: 2px 2px 5px #000;
      z-index: 1020;
    }
    #close-card-modal:hover { color: #f1c40f; }

    /* Estilos dos Marcadores Específicos do Modal */
    .modal-marker {
      position: absolute;
      width: 75px;          
      height: 75px;         
      font-size: 55px;      
      background-color: rgba(0,0,0,0.8);
      border: 1px solid #aaa;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: grab;
      z-index: 1010;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.9);
    }
    .modal-marker:active {
      cursor: grabbing;
    }

    /* Estilos da Tocha */
    #torch-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      background-color: #222;
      border-radius: 8px;
      border: 2px solid #444;
      padding: 10px;
      box-sizing: border-box;
    }
    
    #torch-container {
      position: relative;
      display: inline-block;
      max-width: 100%;
    }
    
    #torch-mat {
      max-width: 680px; 
      width: 100%;
      border-radius: 8px;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.5);
      cursor: pointer;
      display: block;
    }

    #torch-marker {
      position: absolute;
      top: 20px;
      left: 340px;
      width: 80px; 
      height: auto;
      cursor: grab;
      z-index: 20;
      filter: drop-shadow(4px 4px 10px rgba(0,0,0,0.9));
    }
    #torch-marker:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>

  <!-- Modal de Ficha do Herói / Boss -->
  <div id="card-modal" onclick="closeCardModal(event)">
    <div id="card-modal-content" onclick="event.stopPropagation()">
      <span id="close-card-modal" onclick="closeCardModal()">&times;</span>
      <img id="card-modal-img" src="" alt="Full Card" draggable="false">
      
      <!-- Marcadores de Heróis (Hero) -->
      <div id="modal-marker-health" class="modal-marker hero-marker" data-type="health" draggable="true" title="Vida">❤️</div>
      <div id="modal-marker-focus" class="modal-marker hero-marker" data-type="focus" draggable="true" title="Foco">⚡</div>
      
      <!-- Marcadores de Bosses (4 Corações Negros) -->
      <div id="modal-marker-boss1" class="modal-marker boss-marker" data-type="boss1" draggable="true" title="Vida Boss 1">🖤</div>
      <div id="modal-marker-boss2" class="modal-marker boss-marker" data-type="boss2" draggable="true" title="Vida Boss 2">🖤</div>
      <div id="modal-marker-boss3" class="modal-marker boss-marker" data-type="boss3" draggable="true" title="Vida Boss 3">🖤</div>
      <div id="modal-marker-boss4" class="modal-marker boss-marker" data-type="boss4" draggable="true" title="Vida Boss 4">🖤</div>
      
      <!-- Marcadores de Altares (Bosses) -->
      <div id="modal-marker-altar1" class="modal-marker boss-altar-marker" data-type="altar1" draggable="true" title="Altar 1">⛦</div>
      <div id="modal-marker-altar2" class="modal-marker boss-altar-marker" data-type="altar2" draggable="true" title="Altar 2">⛦</div>
      <div id="modal-marker-altar3" class="modal-marker boss-altar-marker" data-type="altar3" draggable="true" title="Altar 3">⛦</div>
    </div>
  </div>

  <!-- Menu Lateral -->
  <div id="sidebar">
    <div class="deck-container" id="container-goblins" data-deck-id="goblins">
      <div id="count-goblins" class="deck-count"></div>
      <img id="deck-goblins" class="deck-image draggable-deck" title="Goblins">
    </div>

    <div class="deck-container" id="container-minions" data-deck-id="minions">
      <div id="count-minions" class="deck-count"></div>
      <img id="deck-minions" class="deck-image draggable-deck" title="Minions">
    </div>

    <div class="deck-container" id="container-rooms" data-deck-id="rooms">
      <div id="count-rooms" class="deck-count"></div>
      <img id="deck-rooms" class="deck-image draggable-deck" title="Dungeon Deck">
    </div>

    <div class="deck-container" id="container-loot" data-deck-id="loot">
      <div id="count-loot" class="deck-count"></div>
      <img id="deck-loot" class="deck-image draggable-deck" title="Loot">
    </div>

    <div class="deck-container" id="container-spells" data-deck-id="spells">
      <div id="count-spells" class="deck-count"></div>
      <img id="deck-spells" class="deck-image draggable-deck" title="Spells">
    </div>

    <!-- Caixinha de Marcadores Globais -->
    <div class="deck-container" id="markers-box">
      <h3 style="font-size: 14px; margin: 0 0 10px 0; color: #ccc;">Marcadores</h3>
      <div id="markers-container" style="display: flex; flex-wrap: wrap; gap: 4px; justify-content: center;"></div>
    </div>

    <!-- Deck de Heróis -->
    <div class="deck-container" id="container-heroes" data-deck-id="heroes">
      <div id="count-heroes" class="deck-count"></div>
      <img id="deck-heroes" class="deck-image draggable-deck" title="Heroes">
    </div>

    <!-- Deck de Bosses -->
    <div class="deck-container" id="container-bosses" data-deck-id="bosses">
      <div id="count-bosses" class="deck-count"></div>
      <img id="deck-bosses" class="deck-image draggable-deck" title="Bosses">
    </div>
  </div>

  <div id="boards-container">
    <!-- Coluna que envolve a Dungeon e a Tocha -->
    <div id="dungeon-column">
      <div id="dungeon-area"></div>
      
      <!-- Container da Tocha -->
      <div id="torch-wrapper">
        <div id="torch-container">
          <img id="torch-mat" src="" title="Clique com o botão direito para avançar para o Ato II">
          <img id="torch-marker" src="" draggable="true" title="Marcador de Tocha">
        </div>
      </div>
    </div>
    
    <div id="misc-area"></div>
  </div>

  <div style="position: absolute; top: 1672px; border: 1px solid white; border-radius: 10px">
    <audio src="arquivos/songs/FFVIII - Force Your Way.mp3" controls loop></audio>
    <audio src="arquivos/songs/FFIX_Battle_Theme_2_Boss_Theme_24MB.mp3" controls loop></audio><br>
  </div>

  torchmat1: {name:"Torch Mat Act I", src:"arquivos/torch/Torch Mat Act I.png"},
  torchmat2: {name:"Torch Mat Act II", src:"arquivos/torch/Torch Mat Act II.png"},
  torchmarker: {name:"Torch Marker", src:"arquivos/torch/Torch Marker.png"},
}

const cardbacks = {
  roomback: {name:"Dungeon Deck", src:"arquivos/rooms/Room Back.png", text:"Arraste para revelar.", texto:"Arraste para revelar."},
  goblinback: {name:"Goblin Deck", src:"arquivos/goblins/Goblin Back.png", text:"Arraste para revelar.", texto:"Arraste para revelar."},
  minionback: {name:"Minion Deck", src:"arquivos/minions/Minion Back.png", text:"Arraste para revelar.", texto:"Arraste para revelar."},
  lootback: {name:"Loot Deck", src:"arquivos/loot/Loot Back.png", text:"Arraste para revelar.", texto:"Arraste para revelar."},
  spellback: {name:"Spell Deck", src:"arquivos/spells/Spell Back.png", text:"Arraste para revelar.", texto:"Arraste para revelar."},
  heroback: {name:"Heroes", src:"arquivos/heroes/Hero Back.png", text:"Arraste para revelar.", texto:"Arraste para revelar."},
  bossback: {name:"Bosses", src:"arquivos/bosses/Boss Back.png", text:"Arraste para revelar.", texto:"Arraste para revelar."},
}

// 1. Função de Embaralhar
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

// 2. Setup do Dungeon Deck (Rooms), Heroes e Bosses
let numPlayers = 0;
while (![2, 3, 4].includes(numPlayers)) {
  const input = prompt("Quantos jogadores? (Digite 2, 3 ou 4)");
  numPlayers = parseInt(input);
}

let availableRooms = Object.keys(rooms).filter(k => rooms[k].type === "Room");
shuffle(availableRooms);
const countA = numPlayers === 2 ? 9 : (numPlayers === 3 ? 7 : 5);
const deckA = availableRooms.splice(0, countA);
const countBRooms = numPlayers * 3;
const deckBRooms = availableRooms.splice(0, countBRooms);
const deckBEncounters = Array(numPlayers).fill("minionencounter");
const deckB = [...deckBRooms, ...deckBEncounters];
shuffle(deckB);
const deckCRooms = availableRooms.splice(0, 3);
const deckC = [...deckCRooms, "bosslairdoor"];
shuffle(deckC);

// Filtra Heróis e Bosses para puxar apenas os "tokens"
const playableHeroes = Object.keys(heroes).filter(k => !k.endsWith('card'));
const playableBosses = Object.keys(bosses).filter(k => !k.endsWith('card'));

const decks = {
  rooms: [...deckC, ...deckB, ...deckA],
  goblins: ['boomygoblin', 'boomygoblin', 'pokeygoblin', 'shootygoblin', 'stabbygoblin', 'stabbygoblin'],
  minions: Object.keys(minions),
  loot: Object.keys(loot),
  spells: Object.keys(spells),
  heroes: playableHeroes,
  bosses: playableBosses 
};

shuffle(decks.goblins);
shuffle(decks.minions);
shuffle(decks.loot);
shuffle(decks.spells);
shuffle(decks.heroes);
shuffle(decks.bosses); 

const allCardsDB = { ...rooms, ...goblins, ...minions, ...loot, ...spells, ...heroes, ...bosses };

// 3. Setup Visual dos Baralhos na Sidebar
const deckConfigs = [
  { id: 'rooms', back: cardbacks.roomback, action: 'draw_room' },
  { id: 'goblins', back: cardbacks.goblinback, action: 'draw_misc' },
  { id: 'minions', back: cardbacks.minionback, action: 'draw_misc' },
  { id: 'loot', back: cardbacks.lootback, action: 'draw_misc' },
  { id: 'spells', back: cardbacks.spellback, action: 'draw_misc' },
  { id: 'heroes', back: cardbacks.heroback, action: 'draw_misc' },
  { id: 'bosses', back: cardbacks.bossback, action: 'draw_misc' }
];

function atualizarVisualBaralhos() {
  deckConfigs.forEach(cfg => {
    const imgEl = document.getElementById(`deck-${cfg.id}`);
    const countEl = document.getElementById(`count-${cfg.id}`);
    const currentDeck = decks[cfg.id];
    
    countEl.innerText = `${currentDeck.length} cartas`;
    imgEl.src = cfg.back.src;
    imgEl.title = cfg.back.name;
    
    if (currentDeck.length === 0) {
      imgEl.style.opacity = '0.3';
      imgEl.draggable = false;
      imgEl.classList.remove('draggable-deck');
    } else {
      imgEl.style.opacity = '1';
      imgEl.draggable = true;
      imgEl.classList.add('draggable-deck');
    }

    if (!imgEl.dataset.initialized) {
      imgEl.addEventListener('dragstart', (e) => {
        if (decks[cfg.id].length === 0) return e.preventDefault();
        e.dataTransfer.setData('action', cfg.action);
        e.dataTransfer.setData('deckType', cfg.id);
      });
      imgEl.dataset.initialized = "true";
    }

    const container = document.getElementById(`container-${cfg.id}`);
    
    container.addEventListener('dragover', (e) => {
      e.preventDefault();
      container.classList.add('drag-over');
    });

    container.addEventListener('dragleave', () => {
      container.classList.remove('drag-over');
    });

    container.addEventListener('drop', (e) => {
      e.preventDefault();
      container.classList.remove('drag-over');
      
      const action = e.dataTransfer.getData('action');
      const cardId = e.dataTransfer.getData('card_id');
      const originDeck = e.dataTransfer.getData('origin_deck');

      if (action === 'move_card' && originDeck === cfg.id) {
        const cardElement = document.getElementById(cardId);
        if (cardElement) {
          const cardKey = cardElement.dataset.cardKey;
          
          if (cfg.id === 'goblins' || cfg.id === 'minions') {
            decks[cfg.id].unshift(cardKey); 
          } else {
            decks[cfg.id].push(cardKey);
          }
          
          cardElement.remove();
          atualizarVisualBaralhos();
        }
      }
    });
  });
}
atualizarVisualBaralhos();


// ============================================
// LÓGICA DO MODAL DA CARTA DE HERÓI / BOSS
// ============================================
const modalMarkersPositions = {};
let currentModalCardKey = null;

function openCardModal(srcPath, cardKey, deckType) {
  const modal = document.getElementById('card-modal');
  const img = document.getElementById('card-modal-img');
  img.src = srcPath;
  currentModalCardKey = cardKey;

  const isBoss = (deckType === 'bosses');
  const maxAltars = allCardsDB[cardKey].altars || 0;

  if (!modalMarkersPositions[cardKey]) {
    if (isBoss) {
      modalMarkersPositions[cardKey] = {};
      for(let i=1; i<=numPlayers; i++) {
        modalMarkersPositions[cardKey]['boss'+i] = { left: (20 + (i-1)*40) + 'px', top: '20px' };
      }
      for(let i=1; i<=maxAltars; i++) {
        modalMarkersPositions[cardKey]['altar'+i] = { left: (20 + (i-1)*40) + 'px', top: '100px' };
      }
    } else {
      modalMarkersPositions[cardKey] = {
        health: { left: '20px', top: '20px' },
        focus: { left: '100px', top: '20px' }
      };
    }
  }

  const allMarkers = document.querySelectorAll('.modal-marker');
  allMarkers.forEach(marker => {
    const isBossMarker = marker.classList.contains('boss-marker');
    const isAltarMarker = marker.classList.contains('boss-altar-marker');
    
    if (isBoss) {
      if (isBossMarker) {
        const bossIndex = parseInt(marker.dataset.type.replace('boss', ''));
        if (bossIndex <= numPlayers) {
          marker.style.display = 'flex';
          marker.style.left = modalMarkersPositions[cardKey][marker.dataset.type].left;
          marker.style.top = modalMarkersPositions[cardKey][marker.dataset.type].top;
        } else {
          marker.style.display = 'none';
        }
      } else if (isAltarMarker) {
        const altarIndex = parseInt(marker.dataset.type.replace('altar', ''));
        if (altarIndex <= maxAltars) {
          marker.style.display = 'flex';
          marker.style.left = modalMarkersPositions[cardKey][marker.dataset.type].left;
          marker.style.top = modalMarkersPositions[cardKey][marker.dataset.type].top;
        } else {
          marker.style.display = 'none';
        }
      } else {
        marker.style.display = 'none';
      }
    } else {
      if (!isBossMarker && !isAltarMarker) {
        marker.style.display = 'flex';
        marker.style.left = modalMarkersPositions[cardKey][marker.dataset.type].left;
        marker.style.top = modalMarkersPositions[cardKey][marker.dataset.type].top;
      } else {
        marker.style.display = 'none';
      }
    }
  });

  modal.style.display = 'flex';
}

function closeCardModal(event) {
  if (event && event.target.id === 'card-modal-img') return; 
  document.getElementById('card-modal').style.display = 'none';
  currentModalCardKey = null;
}

const modalContent = document.getElementById('card-modal-content');
const modalMarkers = document.querySelectorAll('.modal-marker');
let activeModalMarker = null;
let modalMarkerOffsetX = 0;
let modalMarkerOffsetY = 0;

modalMarkers.forEach(marker => {
  marker.addEventListener('dragstart', (e) => {
    activeModalMarker = marker;
    const rect = marker.getBoundingClientRect();
    modalMarkerOffsetX = e.clientX - rect.left;
    modalMarkerOffsetY = e.clientY - rect.top;
    
    e.dataTransfer.setData('action', 'move_modal_marker');
    e.dataTransfer.effectAllowed = 'move';
  });
});

modalContent.addEventListener('dragover', (e) => {
  if (e.dataTransfer.getData('action') === 'move_modal_marker' || activeModalMarker) {
    e.preventDefault();
  }
});

modalContent.addEventListener('drop', (e) => {
  if ((e.dataTransfer.getData('action') === 'move_modal_marker' || activeModalMarker) && currentModalCardKey) {
    e.preventDefault();
    const rect = modalContent.getBoundingClientRect();
    
    let x = e.clientX - rect.left - modalMarkerOffsetX;
    let y = e.clientY - rect.top - modalMarkerOffsetY;

    x = Math.max(0, Math.min(x, rect.width - activeModalMarker.offsetWidth));
    y = Math.max(0, Math.min(y, rect.height - activeModalMarker.offsetHeight));

    activeModalMarker.style.left = x + 'px';
    activeModalMarker.style.top = y + 'px';

    const type = activeModalMarker.dataset.type;
    modalMarkersPositions[currentModalCardKey][type] = { left: x + 'px', top: y + 'px' };
    
    activeModalMarker = null;
  }
});


// --- Setup e Lógica dos Marcadores Globais ---
const tokensList = ['1️⃣','2️⃣','3️⃣','4️⃣','5️⃣','6️⃣','🚫','🚫','🚫','🚫','🚫','🚫','👺','👹', '😎','😼','🐶','🥷'];

function criarImagemCarta(chaveCarta, originDeckId, isFacedown = false) {
  const dadosCarta = allCardsDB[chaveCarta];
  const img = document.createElement('img');
  
  img.dataset.isFacedown = isFacedown;
  
  if (isFacedown && originDeckId === 'rooms') {
    img.src = cardbacks.roomback.src;
    img.title = "Dungeon Card (Face para baixo)";
  } else {
    img.src = dadosCarta.src;
    img.title = `${dadosCarta.name}\n\n${dadosCarta.texto}`;
  }

  img.alt = dadosCarta.name;
  img.classList.add('card');
  
  img.draggable = true;
  img.id = 'card_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
  img.dataset.rotation = 0;
  img.dataset.originDeck = originDeckId; 
  img.dataset.cardKey = chaveCarta;

  img.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('action', 'move_card');
    e.dataTransfer.setData('card_id', img.id);
    e.dataTransfer.setData('origin_deck', img.dataset.originDeck);
  });

  img.addEventListener('click', (e) => {
    if (img.dataset.isFacedown === 'true') {
      img.draggable = false;
      
      img.style.transition = 'transform 0.15s ease-in';
      img.style.transform = `rotate(${img.dataset.rotation}deg) scaleX(0)`;
      
      setTimeout(() => {
        img.src = dadosCarta.src;
        img.title = `${dadosCarta.name}\n\n${dadosCarta.texto}`;
        
        img.style.transition = 'transform 0.15s ease-out';
        img.style.transform = `rotate(${img.dataset.rotation}deg) scaleX(1)`;
        
        setTimeout(() => {
          img.dataset.isFacedown = 'false';
          img.style.transition = 'transform 0.3s ease';
          img.draggable = true;
        }, 150);
      }, 150);
    }
  });

  // Função centralizada para clique secundário / double tap
  const handleSecondaryAction = () => {
    if (originDeckId === 'heroes' || originDeckId === 'bosses') {
      const fullCardKey = chaveCarta + 'card'; 
      const fullCardData = allCardsDB[fullCardKey];
      if (fullCardData) {
        openCardModal(fullCardData.src, fullCardKey, originDeckId);
      }
    } else {
      let rotacaoAtual = parseInt(img.dataset.rotation);
      rotacaoAtual += 90;
      img.dataset.rotation = rotacaoAtual;
      img.style.transform = `rotate(${rotacaoAtual}deg)`;
    }
  };

  img.addEventListener('contextmenu', (evt) => {
    evt.preventDefault();
    handleSecondaryAction();
  });

  img.addEventListener('dblclick', (evt) => {
    evt.preventDefault();
    handleSecondaryAction();
  });

  return img;
}

let historicoJogadas = [];

function criarGrid(containerId, totalSlots, slotAcceptsActions, temEntrance = false) {
  const container = document.getElementById(containerId);
  const centroIndex = Math.floor(totalSlots / 2);

  for (let i = 0; i < totalSlots; i++) {
    const slot = document.createElement('div');
    slot.classList.add('slot');
    slot.dataset.index = i;

    if (temEntrance && i === centroIndex) {
      const entranceImg = criarImagemCarta('entrance', 'rooms', false);
      slot.appendChild(entranceImg);
    }

    slot.addEventListener('dragover', (e) => {
      e.preventDefault();
      slot.classList.add('drag-over');
    });

    slot.addEventListener('dragleave', () => {
      slot.classList.remove('drag-over');
    });

    slot.addEventListener('drop', (e) => {
      e.preventDefault();
      slot.classList.remove('drag-over');
      
      const action = e.dataTransfer.getData('action');
      const deckType = e.dataTransfer.getData('deckType');
      const cardId = e.dataTransfer.getData('card_id');
      const markerId = e.dataTransfer.getData('marker_id');

      const hasCard = slot.querySelector('.card') !== null;

      if (action === 'move_marker') {
        const markerElement = document.getElementById(markerId);
        if (markerElement) {
          slot.appendChild(markerElement);
        }
      } 
      else if (!hasCard) {
        if (slotAcceptsActions.includes(action) && (action === 'draw_room' || action === 'draw_misc')) {
          if (decks[deckType] && decks[deckType].length > 0) {
            const drawnKey = decks[deckType].pop();
            
            const isFacedown = (action === 'draw_room');
            const newImage = criarImagemCarta(drawnKey, deckType, isFacedown);
            
            slot.prepend(newImage);

            historicoJogadas.push({
              deckOrigem: deckType,
              chaveCarta: drawnKey,
              elementoImg: newImage
            });

            atualizarVisualBaralhos();
          }
        } 
        else if (slotAcceptsActions.includes(action) && action === 'move_card') {
          const cardElement = document.getElementById(cardId);
          if (cardElement) {
            slot.prepend(cardElement);
          }
        }
      }
    });

    container.appendChild(slot);
  }
}

criarGrid('dungeon-area', 49, ['draw_room', 'move_card'], true); 
criarGrid('misc-area', 70, ['draw_misc', 'move_card'], false); 

window.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    if (historicoJogadas.length > 0) {
      const ultimaJogada = historicoJogadas.pop();
      ultimaJogada.elementoImg.remove();
      decks[ultimaJogada.deckOrigem].push(ultimaJogada.chaveCarta);
      atualizarVisualBaralhos();
    }
  }
});

torchMatImg.src = torchmats.torchmat1.src;

function advanceToActII() {
  if (!isActII) {
    const confirmar = confirm("Tem certeza de que deseja avançar para o Ato II? Esta ação é irreversível!");
    if (!confirmar) return;

    torchMatImg.style.transition = 'transform 0.15s ease-in';
    torchMatImg.style.transform = 'scaleX(0)';
    
    setTimeout(() => {
      torchMatImg.src = torchmats.torchmat2.src;
      torchMatImg.title = "Torch Mat Act II";
      
      torchMatImg.style.transition = 'transform 0.15s ease-out';
      torchMatImg.style.transform = 'scaleX(1)';
      
      setTimeout(() => {
        isActII = true;
        torchMatImg.style.cursor = 'default';
      }, 150);
    }, 150);
  }
}

torchMatImg.addEventListener('contextmenu', (evt) => {
  evt.preventDefault();
  advanceToActII();
});

  evt.preventDefault();

});

  }
