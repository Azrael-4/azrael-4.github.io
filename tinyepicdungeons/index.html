<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiny Epic Dungeons Online</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      gap: 20px;
      padding: 20px;
      background-color: #1a1a1a;
      color: #fff;
      align-items: flex-start;
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* Barra lateral fixa e visível */
    #sidebar {
      width: 155px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      position: sticky;
      top: 20px;
      flex-shrink: 0; /* Impede que a sidebar seja comprimida ou suma */
    }

    .deck-container {
      padding: 10px;
      background-color: #333;
      border-radius: 8px;
      text-align: center;
      transition: background-color 0.2s;
    }

    .deck-container.drag-over {
      background-color: #555;
    }
    
    .deck-count {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    #boards-container {
      display: flex;
      gap: 20px;
    }

    /* Envolve a Dungeon e a Tocha na mesma coluna */
    #dungeon-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Grid original 7x7 */
    #dungeon-area {
      display: grid;
      grid-template-columns: repeat(7, 150px);
      grid-template-rows: repeat(7, 150px);
      gap: 5px;
      padding: 20px;
      background-color: #222;
      border-radius: 8px;
      border: 2px solid #444;
    }

    /* Nova grid Misc agora é 7x7 */
    #misc-area {
      display: grid;
      grid-template-columns: repeat(7, 150px);
      grid-template-rows: repeat(7, 150px); 
      gap: 5px;
      padding: 20px;
      background-color: #1c2a38; 
      border-radius: 8px;
      border: 2px solid #2a4055;
    }

    .slot {
      width: 150px;
      height: 150px;
      background-color: #2a2a2a;
      border: 1px dashed #555;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .slot.drag-over {
      background-color: #444;
      border-color: #888;
    }

    .card {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.5);
      transition: transform 0.3s ease; 
      cursor: grab;
    }
    .card:active {
      cursor: grabbing;
    }

    .deck-image {
      width: 120px;
      height: 120px;
      margin: 0 auto;
      display: block;
      border-radius: 8px;
      object-fit: cover;
    }

    .draggable-deck {
      cursor: grab;
    }
    .draggable-deck:active {
      cursor: grabbing;
    }

    /* Estilos dos Marcadores */
    .marker {
      width: 28px;
      height: 28px;
      background-color: rgba(0,0,0,0.8);
      border: 1px solid #666;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: grab;
      z-index: 10;
      user-select: none;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }
    .marker:active {
      cursor: grabbing;
    }

    .slot .marker { position: absolute; margin: 0; }
    .slot .marker:nth-of-type(1) { top: 5px; left: 5px; }
    .slot .marker:nth-of-type(2) { top: 5px; right: 5px; }
    .slot .marker:nth-of-type(3) { bottom: 5px; left: 5px; }
    .slot .marker:nth-of-type(4) { bottom: 5px; right: 5px; }
    .slot .marker:nth-of-type(5) { top: 50%; left: 5px; transform: translateY(-50%); }
    .slot .marker:nth-of-type(6) { top: 50%; right: 5px; transform: translateY(-50%); }
    .slot .marker:nth-of-type(n+7) { top: 50%; left: 50%; transform: translate(-50%, -50%); }

    /* Estilos do Modal de Herói / Boss (Card) */
    #card-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
    }
    #card-modal-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #card-modal-img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 12px;
      box-shadow: 0px 0px 20px rgba(0,0,0,0.8);
    }
    #close-card-modal {
      position: absolute;
      top: -15px;
      right: -25px;
      color: #fff;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      text-shadow: 2px 2px 5px #000;
    }
    #close-card-modal:hover { color: #f1c40f; }

    /* Estilos da Tocha */
    #torch-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      background-color: #222;
      border-radius: 8px;
      border: 2px solid #444;
      padding: 10px;
      box-sizing: border-box;
    }
    
    #torch-container {
      position: relative;
      display: inline-block;
      max-width: 100%;
    }
    
    #torch-mat {
      max-width: 1080px; /* Alinha com a largura aproximada da Dungeon 7x7 */
      width: 100%;
      border-radius: 8px;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.5);
      cursor: pointer;
      display: block;
    }

    #torch-marker {
      position: absolute;
      top: 20px;
      left: 340px;
      width: 80px; /* Tamanho customizável dependendo do asset */
      height: auto;
      cursor: grab;
      z-index: 20;
      filter: drop-shadow(4px 4px 10px rgba(0,0,0,0.9));
    }
    #torch-marker:active {
      cursor: grabbing;
    }
  </style>
</head>

      <div id="count-bosses" class="deck-count"></div>
      <img id="deck-bosses" class="deck-image draggable-deck" title="Bosses">
    </div>
  </div>

  <div id="boards-container">

      </div>
    </div>
    
    <div id="misc-area"></div>
  </div>

// 1. Função de Embaralhar
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

// 2. Setup do Dungeon Deck (Rooms), Heroes e Bosses
let numPlayers = 0;
while (![2, 3, 4].includes(numPlayers)) {
  const input = prompt("Quantos jogadores? (Digite 2, 3 ou 4)");
  numPlayers = parseInt(input);
}

let availableRooms = Object.keys(rooms).filter(k => rooms[k].type === "Room");
shuffle(availableRooms);
const countA = numPlayers === 2 ? 9 : (numPlayers === 3 ? 7 : 5);
const deckA = availableRooms.splice(0, countA);
const countBRooms = numPlayers * 3;
const deckBRooms = availableRooms.splice(0, countBRooms);
const deckBEncounters = Array(numPlayers).fill("minionencounter");
const deckB = [...deckBRooms, ...deckBEncounters];
shuffle(deckB);
const deckCRooms = availableRooms.splice(0, 3);
const deckC = [...deckCRooms, "bosslairdoor"];
shuffle(deckC);

// Filtra Heróis e Bosses para puxar apenas os "tokens"
const playableHeroes = Object.keys(heroes).filter(k => !k.endsWith('card'));
const playableBosses = Object.keys(bosses).filter(k => !k.endsWith('card'));

const decks = {
  rooms: [...deckC, ...deckB, ...deckA],
  goblins: ['boomygoblin', 'boomygoblin', 'pokeygoblin', 'shootygoblin', 'stabbygoblin', 'stabbygoblin'],
  minions: Object.keys(minions),
  loot: Object.keys(loot),
  spells: Object.keys(spells),
  heroes: playableHeroes,
  bosses: playableBosses 
};

shuffle(decks.goblins);
shuffle(decks.minions);
shuffle(decks.loot);
shuffle(decks.spells);
shuffle(decks.heroes);

// 3. Setup Visual dos Baralhos na Sidebar
const deckConfigs = [
  { id: 'rooms', back: cardbacks.roomback, action: 'draw_room' },
  { id: 'goblins', back: cardbacks.goblinback, action: 'draw_misc' },
  { id: 'minions', back: cardbacks.minionback, action: 'draw_misc' },
  { id: 'loot', back: cardbacks.lootback, action: 'draw_misc' },
  { id: 'spells', back: cardbacks.spellback, action: 'draw_misc' },
  { id: 'heroes', back: cardbacks.heroback, action: 'draw_misc' },
  { id: 'bosses', back: cardbacks.bossback, action: 'draw_misc' }
];

function atualizarVisualBaralhos() {
  deckConfigs.forEach(cfg => {
    const imgEl = document.getElementById(`deck-${cfg.id}`);
    const countEl = document.getElementById(`count-${cfg.id}`);
    const currentDeck = decks[cfg.id];
    
    countEl.innerText = `${currentDeck.length} cartas`;
    imgEl.src = cfg.back.src;
    imgEl.title = cfg.back.name;
    
    if (currentDeck.length === 0) {
      imgEl.style.opacity = '0.3';
      imgEl.draggable = false;
      imgEl.classList.remove('draggable-deck');
    } else {
      imgEl.style.opacity = '1';
      imgEl.draggable = true;
      imgEl.classList.add('draggable-deck');
    }

    if (!imgEl.dataset.initialized) {
      imgEl.addEventListener('dragstart', (e) => {
        if (decks[cfg.id].length === 0) return e.preventDefault();
        e.dataTransfer.setData('action', cfg.action);
        e.dataTransfer.setData('deckType', cfg.id);
      });
      imgEl.dataset.initialized = "true";
    }

    const container = document.getElementById(`container-${cfg.id}`);
    
    container.addEventListener('dragover', (e) => {
      e.preventDefault();
      container.classList.add('drag-over');
    });

    container.addEventListener('dragleave', () => {
      container.classList.remove('drag-over');
    });

    container.addEventListener('drop', (e) => {
      e.preventDefault();
      container.classList.remove('drag-over');
      
      const action = e.dataTransfer.getData('action');
      const cardId = e.dataTransfer.getData('card_id');
      const originDeck = e.dataTransfer.getData('origin_deck');

      if (action === 'move_card' && originDeck === cfg.id) {
        const cardElement = document.getElementById(cardId);
        if (cardElement) {
          const cardKey = cardElement.dataset.cardKey;
          
          if (cfg.id === 'goblins' || cfg.id === 'minions') {
            decks[cfg.id].unshift(cardKey); 
          } else {
            decks[cfg.id].push(cardKey);
          }
          
          cardElement.remove();
          atualizarVisualBaralhos();
        }
      }
    });
  });
}
atualizarVisualBaralhos();

// 5. Criação da Imagem da Carta (Com Suporte para Cartas Viradas)
function criarImagemCarta(chaveCarta, originDeckId, isFacedown = false) {
  const dadosCarta = allCardsDB[chaveCarta];
  const img = document.createElement('img');
  
  // Salva no dataset se a carta está virada para baixo
  img.dataset.isFacedown = isFacedown;
  
  if (isFacedown && originDeckId === 'rooms') {
    img.src = cardbacks.roomback.src;
    img.title = "Dungeon Card (Face para baixo)";
  } else {
    img.src = dadosCarta.src;
    img.title = `${dadosCarta.name}\n\n${dadosCarta.text}`;
  }

  img.alt = dadosCarta.name;
  img.classList.add('card');
  
  img.draggable = true;
  img.id = 'card_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
  img.dataset.rotation = 0;
  img.dataset.originDeck = originDeckId; 
  img.dataset.cardKey = chaveCarta;

  img.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('action', 'move_card');
    e.dataTransfer.setData('card_id', img.id);
    e.dataTransfer.setData('origin_deck', img.dataset.originDeck);
  });

  // Evento para "Virar a carta" com botão esquerdo
  img.addEventListener('click', (e) => {
    if (img.dataset.isFacedown === 'true') {
      img.draggable = false; // Impede arrastar durante a animação
      
      // Animação de encolher (metade do Flip)
      img.style.transition = 'transform 0.15s ease-in';
      img.style.transform = `rotate(${img.dataset.rotation}deg) scaleX(0)`;
      
      setTimeout(() => {
        // Revela a carta
        img.src = dadosCarta.src;
        img.title = `${dadosCarta.name}\n\n${dadosCarta.text}`;
        
        // Animação de expandir (segunda metade do Flip)
        img.style.transition = 'transform 0.15s ease-out';
        img.style.transform = `rotate(${img.dataset.rotation}deg) scaleX(1)`;
        
        setTimeout(() => {
          img.dataset.isFacedown = 'false';
          img.style.transition = 'transform 0.3s ease'; // Volta à transição padrão
          img.draggable = true;
        }, 150);
      }, 150);
    }
  });

  img.addEventListener('contextmenu', (evt) => {
    evt.preventDefault();
    
    if (originDeckId === 'heroes' || originDeckId === 'bosses') {
      const fullCardKey = chaveCarta + 'card'; 
      const fullCardData = allCardsDB[fullCardKey];
      if (fullCardData) {
        openCardModal(fullCardData.src);
      }
    } else {
      // Rotaciona as outras cartas (funciona inclusive se estiver virada pra baixo)
      let rotacaoAtual = parseInt(img.dataset.rotation);
      rotacaoAtual += 90;
      img.dataset.rotation = rotacaoAtual;
      img.style.transform = `rotate(${rotacaoAtual}deg)`;
    }
  });

  return img;
}

// 6. Histórico Global para Ctrl+Z
let historicoJogadas = [];

// 7. Gerador Genérico de Grids
function criarGrid(containerId, totalSlots, slotAcceptsActions, temEntrance = false) {
  const container = document.getElementById(containerId);
  const centroIndex = Math.floor(totalSlots / 2);

  for (let i = 0; i < totalSlots; i++) {
    const slot = document.createElement('div');
    slot.classList.add('slot');
    slot.dataset.index = i;

    if (temEntrance && i === centroIndex) {
      // A Entrance inicia virada para cima
      const entranceImg = criarImagemCarta('entrance', 'rooms', false);
      slot.appendChild(entranceImg);
    }

    slot.addEventListener('dragover', (e) => {
      e.preventDefault();
      slot.classList.add('drag-over');
    });

    slot.addEventListener('dragleave', () => {
      slot.classList.remove('drag-over');
    });

    slot.addEventListener('drop', (e) => {
      e.preventDefault();
      slot.classList.remove('drag-over');
      
      const action = e.dataTransfer.getData('action');
      const deckType = e.dataTransfer.getData('deckType');
      const cardId = e.dataTransfer.getData('card_id');
      const markerId = e.dataTransfer.getData('marker_id');

      const hasCard = slot.querySelector('.card') !== null;

      if (action === 'move_marker') {
        const markerElement = document.getElementById(markerId);
        if (markerElement) {
          slot.appendChild(markerElement);
        }
      } 
      else if (!hasCard) {
        if (slotAcceptsActions.includes(action) && (action === 'draw_room' || action === 'draw_misc')) {
          if (decks[deckType] && decks[deckType].length > 0) {
            const drawnKey = decks[deckType].pop();
            
            // Se a ação é 'draw_room' (comprar do Dungeon Deck), entra virada para baixo (isFacedown = true)
            const isFacedown = (action === 'draw_room');
            const newImage = criarImagemCarta(drawnKey, deckType, isFacedown);
            
            slot.prepend(newImage);

            historicoJogadas.push({
              deckOrigem: deckType,
              chaveCarta: drawnKey,
              elementoImg: newImage
            });

            atualizarVisualBaralhos();
          }
        } 
        else if (slotAcceptsActions.includes(action) && action === 'move_card') {
          const cardElement = document.getElementById(cardId);
          if (cardElement) {
            slot.prepend(cardElement);
          }
        }
      }
    });

    container.appendChild(slot);
  }
}

criarGrid('dungeon-area', 49, ['draw_room', 'move_card'], true); 
criarGrid('misc-area', 49, ['draw_misc', 'move_card'], false); 

// 8. Funcionalidade Ctrl + Z
window.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    if (historicoJogadas.length > 0) {
      const ultimaJogada = historicoJogadas.pop();
      ultimaJogada.elementoImg.remove();
      decks[ultimaJogada.deckOrigem].push(ultimaJogada.chaveCarta);
      atualizarVisualBaralhos();
    }
  }
});

// LÓGICA EXCLUSIVA DA TOCHA (TORCH MAT)
// ============================================
const torchMatImg = document.getElementById('torch-mat');
const torchMarker = document.getElementById('torch-marker');
const torchContainer = document.getElementById('torch-container');
let isActII = false;

// Inicializa as imagens
torchMatImg.src = torchmats.torchmat1.src;
torchMarker.src = torchmats.torchmarker.src;

// Clique com o botão direito para virar o Tabuleiro da Tocha (Ato I para Ato II)
torchMatImg.addEventListener('contextmenu', (evt) => {
  evt.preventDefault(); // Impede que o menu de clique direito do navegador apareça

  if (!isActII) {
    // Pergunta de confirmação com OK e Cancelar
    const confirmar = confirm("Tem certeza de que deseja avançar para o Ato II? Esta ação é irreversível.");
    if (!confirmar) return; // Se clicar em Cancelar, interrompe a ação

    // Primeira metade da animação (encolher)
    torchMatImg.style.transition = 'transform 0.15s ease-in';
    torchMatImg.style.transform = 'scaleX(0)';
    
    setTimeout(() => {
      // Troca a imagem
      torchMatImg.src = torchmats.torchmat2.src;
      torchMatImg.title = "Torch Mat Act II";
      
      // Segunda metade da animação (expandir)
      torchMatImg.style.transition = 'transform 0.15s ease-out';
      torchMatImg.style.transform = 'scaleX(1)';
      
      setTimeout(() => {
        isActII = true;
        torchMatImg.style.cursor = 'default'; // Não é mais clicável
      }, 150);
    }, 150);
  }
});

// Arrastar e Soltar do Marcador de Tocha
let torchMarkerOffsetX = 0;
let torchMarkerOffsetY = 0;

torchMarker.addEventListener('dragstart', (e) => {
  const rect = torchMarker.getBoundingClientRect();
  torchMarkerOffsetX = e.clientX - rect.left;
  torchMarkerOffsetY = e.clientY - rect.top;
  
  e.dataTransfer.setData('action', 'move_torch_marker');
  e.dataTransfer.effectAllowed = 'move';
});

torchContainer.addEventListener('dragover', (e) => {
  e.preventDefault(); // Necessário para aceitar o drop
});

torchContainer.addEventListener('drop', (e) => {
  if (e.dataTransfer.getData('action') === 'move_torch_marker') {
    e.preventDefault();
    const rect = torchContainer.getBoundingClientRect();
    
    // Calcula a nova posição baseada em onde o mouse soltou
    let x = e.clientX - rect.left - torchMarkerOffsetX;
    let y = e.clientY - rect.top - torchMarkerOffsetY;

    // Mantém o marcador dentro dos limites do container da Tocha
    x = Math.max(0, Math.min(x, rect.width - torchMarker.offsetWidth));
    y = Math.max(0, Math.min(y, rect.height - torchMarker.offsetHeight));

    torchMarker.style.left = x + 'px';
    torchMarker.style.top = y + 'px';
  }
});
